PreviewHalf.Description="Gibt Replay-Vorschauen außerhalb des Live-Programms (z. B. Multiview und Studio-Vorschau) mit halber Breite und Höhe aus, um die Renderlast zu senken (z. B. 4K -> 1080p, 1080p -> 540p). Im Live-Programm aktive Replays, auch während Szenenübergängen, bleiben in voller Originalauflösung. Speicherpuffer und Exporte/Dateien bleiben unverändert. Erfordert unterstützte 8-Bit-YUV-Quellen mit mindestens 1280 px Breite und durch 4 teilbaren Dimensionen; nicht unterstützte Formate bleiben in Originalauflösung."
